<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52525b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="topFacet" x1="14" y1="11" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="leftFacet" x1="14" y1="21" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="rightFacet" x1="50" y1="21" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="neonGlow" x="10" y="10" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- 3D Hexagonal Prism Facets -->
  <path d="M32 12L49 21.8L32 31.6L15 21.8Z" fill="url(#topFacet)" fill-opacity="0.95"/>
  <path d="M15 21.8L32 31.6V51.2L15 41.4Z" fill="url(#leftFacet)"/>
  <path d="M32 31.6L49 21.8V41.4L32 51.2Z" fill="url(#rightFacet)"/>

  <!-- Prism Structural Facet Edges -->
  <path d="M32 12V31.6M15 21.8L32 31.6M49 21.8L32 31.6M32 31.6V51.2" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Stylized Luminous 'F' Monogram -->
  <g filter="url(#neonGlow)">
    <path d="M23 20V45" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M23 20L41 14.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M23 32L36 27.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Terminal Nodes -->
    <circle cx="41" cy="14.5" r="1.5" fill="#ffffff"/>
    <circle cx="36" cy="27.5" r="1.5" fill="#ffffff"/>
  </g>
</svg>